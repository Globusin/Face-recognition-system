
cameras:
  enabled: true
  scan_max_index: 10
  pair_max_delta_ms: 80  # Максимальная разница захвата между камерами
  buffer_size: 8
  max_read_failures: 20
  lock_file: "/tmp/face_recognition_cameras.lock"
  diagnostic_report: "data/camera_diagnostics.json"

  primary:
    device: "/dev/v4l/by-id/usb-Generic_USB_Camera_200901010001-video-index0"
    format: "MJPG"
    width: 1280
    height: 720
    fps: 30

  secondary:
    device: "/dev/v4l/by-id/usb-Suyin_HD_Camera_200910120001-video-index0"
    format: "MJPG"
    width: 1280
    height: 720
    fps: 30

server:
  host: "0.0.0.0"
  port: 8443
  cert_file: "data/security/server.crt"
  key_file: "data/security/server.key"

security:
  admin_token_file: "data/security/admin-token"
  admin_networks: ["127.0.0.1/32", "::1/128"]  # Добавьте только адрес компьютера администратора

stereo_calibration:
  timing_fast_board: true  # Быстрый поиск только в тесте времени
  timing_detection_width: 640  # Углы уточняются на исходном разрешении
  validation_limits:  # Начальные критерии геометрии, не пороги живости
    mean_error_percent: 3.0
    vertical_max_px: 3.0
    plane_rms_mm: 2.0
  output_dir: "data/calibration"
  admin_token: ""  # Задается локально или через CALIBRATION_ADMIN_TOKEN

# Только диагностические пределы качества измерения, не пороги живости
stereo_pad:
  pair_wait_seconds: 5.0  # Сколько ждать подходящую пару без увеличения рассинхрона
  max_delta_ms: 10.0  # Разница доставки, не гарантия одновременной экспозиции
  static_max_delta_ms: 80.0  # Только для неподвижного диагностического предъявления
  max_exposure_error_ms: 30.0  # Условная оценка с учётом теста движения
  max_image_speed_px_s: 25.0
  max_depth_uncertainty_mm: 5.0  # Только временной вклад, не полная ошибка глубины
  max_vertical_px: 8.0
  max_reprojection_px: 4.0
  min_disparity_px: 1.0
  min_depth_mm: 150.0
  max_depth_mm: 2000.0

# Диагностическая проверка объёма лица по двум камерам
# Пороги предварительные: результат не участвует в разрешении доступа
stereo_liveness:
  mode: advisory             # off | advisory | required
  parallel: false            # замер во время распознавания; включение после профилирования
  result_timeout_s: 1.5      # ожидание результата рабочего потока при required
  calibration_id: null       # Каталог в stereo_calibration.output_dir
  mounting_confirmed: false  # Требуется для загрузки сохранённой калибровки
  dense_depth: false         # StereoSGBM тяжелее, включать вручную
  classifier:
    min_points: 25
    max_reprojection_px: 4.0
    max_vertical_px: 8.0
    flat_plane_rms_mm: 1.5   # Ниже этого рельеф считается плоским
    flat_nose_eye_mm: 1.0
    live_plane_rms_mm: 2.0   # Выше этого рельеф похож на объёмное лицо
    live_nose_eye_mm: 3.0
    max_plane_rms_mm: 12.0   # Слишком большой рельеф не считается лицом
    max_nose_eye_mm: 22.0
    min_valid_fraction: 0.25
    min_valid_pixels: 100

# Параметры сохранения изображений
image:
  output_dir: "data"
  filename: "user_image.jpg"

# Параметры базы данных
database:
  host: "localhost"
  port: 5433
  name: "face-recognition"
  user: "postgres"
  password: "fID3P8zg"

# Параметры точки доступа
hotspot:
  ssid: "DoorApp"
  password: "12345678"

# Параметры распознавания
similarity: 0.15  # Порог схожести (чем меньше, тем строже сравнение)

challenge_response:
  # Эксперимент, не включён в разрешение доступа
  policy: disabled           # disabled | adaptive | always
  # adaptive: LIVE — без задания; UNKNOWN или нет стереоданных — задание;
  # SPOOF — отказ (пороги предварительные, возможны ложные отказы)
  pipeline_count: 1          # Заданий в рабочем конвейере, чтобы уложиться в тайм-аут
  count: 3
  baseline_seconds: 0.6
  baseline_timeout: 12.0
  action_timeout: 8.0
  max_gap_seconds: 1.5
  closed_ratio: 0.65
  open_ratio: 0.85
  turn_ratio: 0.18
  neutral_ratio: 0.12
  identity_distance: 0.45

recognition_optimization:
  roi_enabled: true
  roi_padding: 0.30  # Отступ с каждой стороны относительно ширины и высоты лица

# Решение о доступе по нескольким кадрам
multi_frame_recognition:
  mode: adaptive            # adaptive: остановка по свидетельствам, fixed: ровно frames_count кадров
  frames_count: 5           # Сколько кадров анализировать за попытку (только fixed)
  min_successful_frames: 3  # Сколько кадров должны распознать одного пользователя (только fixed)
  frame_delay: 0.15         # Пауза между кадрами, сек. (только fixed)
  max_distance_std: 0.05    # Максимальная нестабильность дистанции по успешным кадрам (fixed)

# Адаптивное накопление свидетельств идентичности (режим adaptive)
# Значения предварительные, требуют калибровки на размеченной выборке
adaptive_recognition:
  min_frames: 3              # Минимум обработанных качественных кадров
  max_frames: 7              # Максимум кадров на попытку
  min_successful_frames: 3   # Минимум совпадений с одним пользователем
  frame_interval_ms: 200     # Минимальный интервал между выбранными кадрами
  early_stop_threshold: 0.98 # Порог досрочного завершения при достаточных свидетельствах
  max_attempt_duration_s: 2.5  # Предельная длительность попытки распознавания
  max_distance_std: 0.05     # Пока оставлен существующий порог стабильности

# Накопление свидетельств идентичности
bayesian_scoring:
  enabled: true
  prior_probability: 0.2      # Начальное отношение правдоподобий для конкретного пользователя
  decision_threshold: 0.98    # Порог score для допуска: это не вероятность
  distance_sigma: 0.08        # Чем меньше значение, тем сильнее штрафуются большие дистанции
  unknown_likelihood: 0.05    # Вероятность похожего кадра при гипотезе "это не этот пользователь"
  miss_likelihood_ratio: 0.4  # Штраф за кадр, который поддержал другого пользователя
  # Соседние кадры одной камеры коррелированы, поэтому второй и последующие
  # кадры дают лишь часть свидетельства первого
  correlation_discount: 0.4

# Журнал доступов и отказов в PostgreSQL: без изображений и embeddings
audit:
  enabled: true

# Параметры работы системы
detection_interval: 2  # Интервал в секундах между попытками распознавания
door_open_time: 2      # Время в секундах, на которое открывается дверь после успешного распознавания

# Параметры TFT дисплея
display:
  enabled: true
  cs_pin: "D5"         # GPIO5, pin 29
  dc_pin: "D25"        # GPIO25, pin 22
  rst_pin: "D24"       # GPIO24, pin 18
  width: 128
  height: 160
  rotation: 0
  baudrate: 16000000
  bgr: true            # Порядок цветовых каналов панели (бит BGR в MADCTL)

# Настройки логирования
logging:
  level: "INFO"  # Уровень логирования: DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"  # Путь к файлу логов

# Лимит сессии, включая распознавание и задания. При включённой политике
# заданий baseline_timeout и action_timeout должны в него укладываться.
authentication:
  session_timeout_seconds: 20.0
  policy_file: "data/security/authentication-policy.json"  # Переопределение из админ-панели
  capture:
    max_frame_age_seconds: 0.5
    frame_wait_seconds: 1.0
    max_track_gap_seconds: 2.0
    min_track_overlap: 0.25  # Начальный порог IoU, требует проверки на стенде
