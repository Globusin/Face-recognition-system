
camera:
  index: 0
  
  # Разрешение камеры (опционально)
  resolution:
    width: 1280
    height: 720

# Параметры сохранения изображений
image:
  output_dir: "data"
  filename: "user_image.jpg"

# Параметры базы данных
database:
  host: "localhost"
  port: 5433
  name: "face-recognition"
  user: "postgres"
  password: "fID3P8zg"

# Параметры точки доступа
hotspot:
  ssid: "DoorApp"
  password: "12345678"

# Параметры распознавания
similarity: 0.15  # Порог схожести (чем меньше, тем строже сравнение)

# Решение о доступе по нескольким кадрам
multi_frame_recognition:
  frames_count: 5           # Сколько кадров анализировать за одну попытку
  min_successful_frames: 3  # Сколько кадров должны распознать одного пользователя
  frame_delay: 0.15         # Пауза между кадрами, сек.
  max_distance_std: 0.05    # Максимальная нестабильность дистанции по успешным кадрам

# Байесовское накопление уверенности по серии кадров
bayesian_scoring:
  enabled: true
  prior_probability: 0.2      # Начальная вероятность, что кадры принадлежат конкретному пользователю
  decision_threshold: 0.95    # Минимальная итоговая вероятность для допуска
  distance_sigma: 0.08        # Чем меньше значение, тем сильнее штрафуются большие дистанции
  unknown_likelihood: 0.05    # Вероятность похожего кадра при гипотезе "это не этот пользователь"
  miss_likelihood_ratio: 0.4  # Штраф за кадр, который поддержал другого пользователя

# Параметры работы системы
detection_interval: 2  # Интервал в секундах между попытками распознавания
door_open_time: 5      # Время в секундах, на которое открывается дверь после успешного распознавания

# Настройки логирования
logging:
  level: "INFO"  # Уровень логирования: DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"  # Путь к файлу логов
